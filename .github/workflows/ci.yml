name: CI

on:
  # Docs-only changes don't touch the build: skip the macOS jobs for them.
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Build & unit tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen xcbeautify
      - run: xcodebuild -version
      - run: scripts/test.sh unit

  ui:
    name: UI & snapshot tests
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen xcbeautify
      - run: scripts/test.sh ui

  lint:
    name: SwiftLint & SwiftFormat
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: brew install swiftlint swiftformat
      - run: swiftformat --lint .
      - run: swiftlint --strict
